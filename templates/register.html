<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
</head>

<body>

<h1>Register</h1>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

<form method="POST">

    <input
        name="username"
        placeholder="Username"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<br>

<a href="/login">
    Already have an account?
</a>

</body>

</html>
